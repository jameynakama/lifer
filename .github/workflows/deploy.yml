name: CI/CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flockdeck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/flockdeck_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: backend
      - name: Apply migrations to test DB
        run: for f in backend/migrations/*.up.sql; do psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"; done
      - run: cd backend && go vet ./... && go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npx svelte-kit sync && npx svelte-check --tsconfig tsconfig.json && npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          # `timeout` bounds the whole thing: ssh waits for EOF on the remote
          # command's output, which a process holding those descriptors open can
          # withhold long after the work is done. `tee` keeps the log on the
          # droplet, where it survives whatever ssh does with the stream -- and
          # the phase markers are what make a slow deploy diagnosable at all.
          # `|| status=$?` so the step runs its cleanup and its diagnosis
          # instead of aborting here under the shell errexit default.
          status=0
          timeout 600 ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -o pipefail
            {
              phase() { echo "== $(date -u +%H:%M:%S) $* =="; }
              set -e
              cd /app/flockdeck
              phase "fetch"
              git fetch origin main
              git reset --hard FETCH_HEAD
              phase "npm ci"
              (cd frontend && npm ci)
              phase "frontend build"
              (cd frontend && npm run build)
              phase "go build"
              (cd backend && /usr/local/go/bin/go build -o bin/flockdeck ./cmd/server)
              phase "migrate"
              set -a && . ./.env && set +a
              migrate -path backend/migrations -database "$DATABASE_URL" up
              phase "restart"
              # Detached: a restarted service that inherits these descriptors
              # holds the ssh connection open long after the deploy finishes.
              sudo systemctl restart flockdeck < /dev/null > /dev/null 2>&1
              phase "done"
            } 2>&1 | tee -a "$HOME/flockdeck-deploy.log"
          ' || status=$?
          rm /tmp/deploy_key
          if [ $status -eq 124 ]; then
            echo "Deploy timed out after 600s. The work may have completed anyway:"
            echo "check /var/log/flockdeck-deploy.log on the droplet for the last phase reached."
          fi
          exit $status
